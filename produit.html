<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enigmium - Page Produit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        enigmiumGreen: '#a3c9a8',
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .carousel-container {
            position: relative;
            width: 100%;
            height: 320px;
            overflow: hidden;
            background-color: #f9fafb;
        }
        @media (min-width: 768px) {
            .carousel-container {
                height: 420px;
            }
        }
    </style>
</head>
<body class="bg-white min-h-screen font-sans text-gray-900 flex flex-col">

    <!-- HEADER -->
    <header class="border-b border-gray-100 py-4 px-6 md:px-12 flex justify-between items-center bg-white sticky top-0 z-40">
        <div class="flex items-center space-x-3">
            <a href="index.html" class="w-8 h-8 bg-black text-white flex items-center justify-center font-bold text-lg rounded-sm">E</a>
            <span class="text-xl font-bold tracking-tight text-gray-800">Enigmium</span>
        </div>
        <div class="flex items-center space-x-2">
            <span id="navLanguageLabel" class="text-sm text-gray-500">Langues</span>
            <select id="publicLanguageSelector" onchange="changeLanguage()" class="border border-gray-200 rounded px-2 py-1 text-sm bg-gray-50 focus:outline-none focus:ring-1 focus:ring-black">
                <option value="Français">Français</option>
                <option value="Anglais">Anglais</option>
                <option value="Allemand">Allemand</option>
                <option value="Espagnol">Espagnol</option>
                <option value="Italien">Italien</option>
                <option value="Portugais">Portugais</option>
                <option value="Néerlandais">Néerlandais</option>
            </select>
        </div>
    </header>

    <!-- CAROUSEL DE BANNIÈRES PANORAMIQUES -->
    <div id="carouselSection" class="relative group hidden">
        <div class="carousel-container relative">
            <div id="carouselWrapper" class="flex h-full transition-transform duration-500 ease-out">
                <!-- Bannières injectées par JS -->
            </div>
            
            <!-- Contrôles flèches -->
            <button onclick="prevSlide()" class="absolute left-4 top-1/2 -translate-y-1/2 w-10 h-10 bg-white/80 hover:bg-white border border-gray-200 rounded-full flex items-center justify-center text-gray-700 shadow-md opacity-0 group-hover:opacity-100 transition-opacity z-10 focus:outline-none">
                <i data-lucide="chevron-left" class="w-5 h-5"></i>
            </button>
            <button onclick="nextSlide()" class="absolute right-4 top-1/2 -translate-y-1/2 w-10 h-10 bg-white/80 hover:bg-white border border-gray-200 rounded-full flex items-center justify-center text-gray-700 shadow-md opacity-0 group-hover:opacity-100 transition-opacity z-10 focus:outline-none">
                <i data-lucide="chevron-right" class="w-5 h-5"></i>
            </button>
            
            <!-- Bulles de navigation -->
            <div id="carouselDots" class="absolute bottom-4 left-1/2 -translate-x-1/2 flex space-x-2 z-10">
                <!-- Rempli par JS -->
            </div>
        </div>
    </div>

    <!-- MAIN PRODUCT DETAIL -->
    <main class="flex-grow max-w-5xl mx-auto w-full px-6 py-12">
        <div class="flex flex-col md:flex-row gap-12 items-start">
            
            <!-- Couverture du livre (Flottante à gauche) -->
            <div class="w-full md:w-80 shrink-0 flex justify-center">
                <div class="aspect-[3/4] w-64 md:w-full bg-gray-50 border border-gray-150 rounded-lg shadow-md overflow-hidden relative flex items-center justify-center">
                    <img id="bookCover" src="" class="w-full h-full object-cover hidden">
                    <div id="bookCoverFallback" class="text-center p-6 text-gray-300 flex flex-col items-center space-y-2">
                        <i data-lucide="book-open" class="w-16 h-16"></i>
                    </div>
                </div>
            </div>

            <!-- Informations Produit -->
            <div class="flex-grow space-y-8 w-full">
                <div class="space-y-3">
                    <span id="bookCategoryLabel" class="text-xs font-bold uppercase tracking-wider text-gray-400">Catégorie</span>
                    <h1 id="bookTitle" class="text-3xl font-extrabold tracking-tight text-gray-900 leading-tight">--</h1>
                    
                    <!-- Boutons d'achat Amazon & commentaires -->
                    <div class="flex flex-wrap gap-4 pt-3">
                        <a id="buyAmazonBtn" href="#" target="_blank" class="bg-black text-white px-6 py-3 rounded font-medium hover:bg-gray-800 transition-colors inline-flex items-center space-x-2 text-sm shadow-sm">
                            <i data-lucide="shopping-cart" class="w-4 h-4"></i>
                            <span id="buyAmazonBtnText">Acheter sur Amazon</span>
                        </a>
                        <a id="reviewAmazonBtn" href="#" target="_blank" class="border border-gray-200 text-gray-700 px-6 py-3 rounded font-medium hover:bg-gray-50 transition-colors inline-flex items-center space-x-2 text-sm">
                            <i data-lucide="message-square" class="w-4 h-4"></i>
                            <span id="reviewAmazonBtnText">Laisser un commentaire</span>
                        </a>
                    </div>
                </div>

                <!-- Descriptif -->
                <div id="sectionDescription" class="space-y-3 border-t border-gray-100 pt-6 hidden">
                    <h2 id="headerDescription" class="text-xs font-bold uppercase tracking-wider text-gray-500">Descriptif</h2>
                    <div id="bookDescription" class="text-sm text-gray-600 leading-relaxed whitespace-pre-wrap">--</div>
                </div>

                <!-- Contenu du livre -->
                <div id="sectionContent" class="space-y-3 border-t border-gray-100 pt-6 hidden">
                    <h2 id="headerContent" class="text-xs font-bold uppercase tracking-wider text-gray-500">Contenu du livre</h2>
                    <div id="bookContent" class="text-sm text-gray-600 leading-relaxed whitespace-pre-wrap">--</div>
                </div>
            </div>
        </div>

        <!-- RECOMMANDATIONS CROSS-SELLING -->
        <div class="mt-20 border-t border-gray-100 pt-12 space-y-16">
            <div id="sectionSameCollection" class="space-y-6 hidden">
                <h2 id="headerSameCollection" class="text-lg font-bold tracking-tight text-gray-900 border-b border-gray-100 pb-2.5">Dans la même collection</h2>
                <div id="sameCollectionGrid" class="grid grid-cols-2 sm:grid-cols-4 gap-6"></div>
            </div>
            <div id="sectionOtherCollections" class="space-y-6 hidden">
                <h2 id="headerOtherCollections" class="text-lg font-bold tracking-tight text-gray-900 border-b border-gray-100 pb-2.5">Autres collections</h2>
                <div id="otherCollectionsGrid" class="grid grid-cols-2 sm:grid-cols-4 gap-6"></div>
            </div>
        </div>
    </main>

    <footer class="border-t border-gray-100 py-8 text-center text-xs text-gray-400 bg-white">
        <span id="footerText">© 2026 Enigmium. Tous droits réservés.</span>
    </footer>

        const DEFAULT_DEMO_DB = {

    books: [

                    content: "Ideal for all ages!\n- 80 mystery words to decipher\n- Explanatory illustrated sheets\n- Complete solutions at the end",
                    coverUrl: "https://images-na.ssl-images-amazon.com/images/I/81XXXXXX.jpg",

                }
            }
        },

            status: "visible",
            languages: {

                    title: "Tadokuro - Casse-têtes de Logique",

                    description: "Découvrez le casse-tête de logique qui stimule vos neurones.",
                    content: "Grilles de niveau facile à difficile.",

                    content: "Spannende Rätsel und Geheimnisse.",
                    coverUrl: "",

        document.addEventListener('DOMContentLoaded', async () => {
            lucide.createIcons();

            const urlParams = new URLSearchParams(window.location.search);
            currentBookId = urlParams.get('id');
            
            const savedLang = urlParams.get('lang') || localStorage.getItem('enigmium_lang');
            if (savedLang) {
                currentLanguage = savedLang;
            }
            document.getElementById('publicLanguageSelector').value = currentLanguage;

            await fetchBooks();
        });

        async function fetchBooks() {
            try {
                let data = {};
                if (localStorage.getItem('demo_books_db')) {
                    data = JSON.parse(localStorage.getItem('demo_books_db'));
                } else {
                    try {
                        const response = await fetch('books.json');
                        if (!response.ok) throw new Error("CORS or not found");
                        data = await response.json();
                    } catch (e) {
                        localStorage.setItem('demo_books_db', JSON.stringify(DEFAULT_DEMO_DB));
                        data = DEFAULT_DEMO_DB;
                    }
                }
                booksData = data;
                applyInterfaceTranslations();
                renderProductDetails();
            } catch (err) {
                console.error(err);
                alert("Erreur de chargement du produit.");
            }
        }

        function changeLanguage() {
            currentLanguage = document.getElementById('publicLanguageSelector').value;
            localStorage.setItem('enigmium_lang', currentLanguage);
            
            applyInterfaceTranslations();
            renderProductDetails();
        }

        function applyInterfaceTranslations() {
            const lang = currentLanguage || 'Français';
            const t = UI_TRANSLATIONS[lang] || UI_TRANSLATIONS['Français'];

            document.getElementById('navLanguageLabel').innerText = t.nav_languages;
            document.getElementById('buyAmazonBtnText').innerText = t.buy_on_amazon;
            document.getElementById('reviewAmazonBtnText').innerText = t.leave_comment;
            document.getElementById('headerDescription').innerText = t.description_header;
            document.getElementById('headerContent').innerText = t.content_header;
            document.getElementById('headerSameCollection').innerText = t.same_collection;
            document.getElementById('headerOtherCollections').innerText = t.other_collections;
            document.getElementById('footerText').innerText = t.footer_text;
        }

        function renderProductDetails() {
            const book = booksData.books.find(b => b.id === currentBookId);
            if (!book) {
                alert("Livre introuvable.");
                window.location.href = "index.html";
                return;
            }

            const langData = book.languages ? book.languages[currentLanguage] : null;
            if (!langData) {
                // Si la traduction n'existe pas, on cherche la première dispo
                const availableLangs = Object.keys(book.languages || {});
                if (availableLangs.length > 0) {
                    currentLanguage = availableLangs[0];
                    document.getElementById('publicLanguageSelector').value = currentLanguage;
                    applyInterfaceTranslations();
                    renderProductDetails();
                    return;
                } else {
                    alert("Ce livre ne contient aucune traduction.");
                    window.location.href = "index.html";
                    return;
                }
            }

            // Titre et catégorie
            document.getElementById('bookTitle').innerText = langData.title || "Livre sans titre";
            document.getElementById('bookCategoryLabel').innerText = langData.category || "Catégorie";

            // Couverture
            const cover = document.getElementById('bookCover');
            const coverFallback = document.getElementById('bookCoverFallback');
            if (langData.coverUrl) {
                cover.src = langData.coverUrl;
                cover.classList.remove('hidden');
                coverFallback.classList.add('hidden');
            } else {
                cover.classList.add('hidden');
                coverFallback.classList.remove('hidden');
            }

            // Boutons d'achat
            const buyBtn = document.getElementById('buyAmazonBtn');
            const reviewBtn = document.getElementById('reviewAmazonBtn');
            buyBtn.href = langData.amazonUrl || "https://www.amazon.fr";
            
            if (langData.amazonReviewsUrl) {
                reviewBtn.href = langData.amazonReviewsUrl;
                reviewBtn.classList.remove('hidden');
            } else {
                reviewBtn.classList.add('hidden');
            }

            // Descriptif
            const descSec = document.getElementById('sectionDescription');
            const descText = document.getElementById('bookDescription');
            if (langData.description) {
                descText.innerText = langData.description;
                descSec.classList.remove('hidden');
            } else {
                descSec.classList.add('hidden');
            }

            // Contenu
            const contentSec = document.getElementById('sectionContent');
            const contentText = document.getElementById('bookContent');
            if (langData.content) {
                contentText.innerText = langData.content;
                contentSec.classList.remove('hidden');
            } else {
                contentSec.classList.add('hidden');
            }

            // Carrousel de Bannières
            setupCarousel(langData.banners || []);

            // Cross Selling
            renderCrossSelling(book, langData.category);

            lucide.createIcons();
        }

        function setupCarousel(banners) {
            const section = document.getElementById('carouselSection');
            const wrapper = document.getElementById('carouselWrapper');
            const dotsContainer = document.getElementById('carouselDots');

            wrapper.innerHTML = '';
            dotsContainer.innerHTML = '';
            currentSlide = 0;

            if (!banners || banners.length === 0) {
                section.classList.add('hidden');
                return;
            }

            section.classList.remove('hidden');
            totalSlides = banners.length;

            banners.forEach((bannerUrl, idx) => {
                const slide = document.createElement('div');
                slide.className = "w-full h-full shrink-0";
                
                const img = document.createElement('img');
                img.src = bannerUrl;
                img.className = "w-full h-full object-cover";
                slide.appendChild(img);
                wrapper.appendChild(slide);

                const dot = document.createElement('button');
                dot.className = `w-3 h-3 rounded-full transition-colors focus:outline-none ${idx === 0 ? 'bg-black' : 'bg-gray-300'}`;
                dot.onclick = () => goToSlide(idx);
                dotsContainer.appendChild(dot);
            });

            updateCarousel();
        }

        function updateCarousel() {
            const wrapper = document.getElementById('carouselWrapper');
            wrapper.style.transform = `translateX(-${currentSlide * 100}%)`;

            const dots = document.querySelectorAll('#carouselDots button');
            dots.forEach((dot, idx) => {
                if (idx === currentSlide) {
                    dot.classList.remove('bg-gray-300');
                    dot.classList.add('bg-black');
                } else {
                    dot.classList.remove('bg-black');
                    dot.classList.add('bg-gray-300');
                }
            });
        }

        function nextSlide() {
            currentSlide = (currentSlide + 1) % totalSlides;
            updateCarousel();
        }

        function prevSlide() {
            currentSlide = (currentSlide - 1 + totalSlides) % totalSlides;
            updateCarousel();
        }

        function goToSlide(idx) {
            currentSlide = idx;
            updateCarousel();
        }

        function renderCrossSelling(currentBook, currentCategory) {
            const sameGrid = document.getElementById('sameCollectionGrid');
            const otherGrid = document.getElementById('otherCollectionsGrid');
            const sameSection = document.getElementById('sectionSameCollection');
            const otherSection = document.getElementById('sectionOtherCollections');

            sameGrid.innerHTML = '';
            otherGrid.innerHTML = '';

            const lang = currentLanguage || 'Français';
            const t = UI_TRANSLATIONS[lang] || UI_TRANSLATIONS['Français'];

            // Exclure le livre en cours
            const otherBooks = booksData.books.filter(b => b.id !== currentBook.id && b.status !== 'masqué' && b.languages && b.languages[currentLanguage]);

            // 1. Même catégorie (Max 4)
            const sameCollectionBooks = otherBooks.filter(b => b.languages[currentLanguage].category === currentCategory).slice(0, 4);
            if (sameCollectionBooks.length > 0) {
                sameSection.classList.remove('hidden');
                sameCollectionBooks.forEach(b => {
                    sameGrid.appendChild(createCrossSellCard(b, t));
                });
            } else {
                sameSection.classList.add('hidden');
            }

            // 2. Autres catégories (Max 4)
            const otherCollectionBooks = otherBooks.filter(b => b.languages[currentLanguage].category !== currentCategory).slice(0, 4);
            if (otherCollectionBooks.length > 0) {
                otherSection.classList.remove('hidden');
                otherCollectionBooks.forEach(b => {
                    otherGrid.appendChild(createCrossSellCard(b, t));
                });
            } else {
                otherSection.classList.add('hidden');
            }
        }

        function createCrossSellCard(book, t) {
            const langData = book.languages[currentLanguage];
            const link = document.createElement('a');
            link.href = `produit.html?id=${book.id}&lang=${currentLanguage}`;
            link.className = "group flex flex-col space-y-2 cursor-pointer";

            const imgContainer = document.createElement('div');
            imgContainer.className = "aspect-[3/4] bg-gray-50 border border-gray-100 rounded overflow-hidden relative shadow-sm group-hover:shadow transition-shadow flex items-center justify-center";
            
            if (langData.coverUrl) {
                const img = document.createElement('img');
                img.src = langData.coverUrl;
                img.className = "w-full h-full object-cover group-hover:scale-105 transition-transform duration-300";
                imgContainer.appendChild(img);
            } else {
                const noImg = document.createElement('div');
                noImg.className = "text-center p-3 text-gray-300 flex flex-col items-center space-y-1";
                noImg.innerHTML = `<i data-lucide="book-open" class="w-8 h-8"></i><span class="text-xxs">${t.view_book}</span>`;
                imgContainer.appendChild(noImg);
            }

            link.appendChild(imgContainer);

            const title = document.createElement('h4');
            title.className = "text-xs font-bold text-gray-800 group-hover:text-black line-clamp-1";
            title.innerText = langData.title;
            link.appendChild(title);

            return link;
        }
    </script>
</body>
